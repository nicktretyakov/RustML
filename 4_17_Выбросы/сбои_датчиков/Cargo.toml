[package]
name = "museum_humidity_analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"          # Многопоточность (параллельные итераторы)
ndarray = "0.15"        # Массивы для ML
linfa = "0.7"           # Фреймворк машинного обучения
linfa-clustering = "0.7"# Алгоритм K-Means для ML-поиска аномалий
plotters = "0.3"        # Отрисовка графиков (аналог matplotlib)
anyhow = "1.0"          # Обработка ошибок
