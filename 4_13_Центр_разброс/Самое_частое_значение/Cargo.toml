[package]
name = "rentals_analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
# External crates:
#   csv + serde   -> parse rentals.csv into typed records
#   rayon         -> data-parallel multithreading (column analysis + ML inference)
#   anyhow        -> ergonomic error handling
csv = "1.3"
serde = { version = "1", features = ["derive"] }
rayon = "1.10"
anyhow = "1"

[profile.release]
opt-level = 2
