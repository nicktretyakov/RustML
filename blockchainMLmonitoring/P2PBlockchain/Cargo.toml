[package]
name = "P2PBlockchain"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.53.2", features = ["tcp", "noise", "yamux", "request-response", "macros", "tokio", "gossipsub"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
chrono = "0.4"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.5.0"
hex = "0.4"
axum = "0.8.8"
