[package]
name = "breast_cancer_rust"
version = "0.1.0"
edition = "2021"
authors = ["Z User"]
description = "Анализ признаков breast_cancer: отношение средних malignant/benign"

[dependencies]
# крейт для разбора CSV-датасета (транзитивно подтягивает serde,
# который даёт impl Deserialize для HashMap<String, f64>)
csv = "1.3"
# многопоточность: параллельный анализ признаков
rayon = "1.10"

[[bin]]
name = "breast_cancer_rust"
path = "src/main.rs"

[profile.release]
opt-level = 3
